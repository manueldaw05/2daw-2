<!doctype html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Gestor de tareas</title><link rel="stylesheet" href="style.css" defer></head>
<body><main><h1>Gestor de tareas</h1><form id="task-form"><label>Título <input id="title" required></label><label>Descripción <textarea id="description" required></textarea></label><label>Prioridad <select id="priority"><option value="ALTA">ALTA</option><option value="MEDIA">MEDIA</option><option value="BAJA">BAJA</option></select></label><button type="submit">Añadir tarea</button></form><section class="tools"><label>Buscar <input id="search" placeholder="Buscar por título"></label><button id="sort-priority" type="button">Ordenar por prioridad</button></section><section><h2>Listado de tareas</h2><div id="task-list"></div></section></main><script src="app.js" defer></script></body></html>
